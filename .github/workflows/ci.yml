name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # aio-pika 10.x requires Python >= 3.11, which sets the floor for PikaBus 2.0.
        python-version: ['3.11', '3.12', '3.13']

    services:
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: amqp
          RABBITMQ_DEFAULT_PASS: amqp
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        # uv provisions the interpreter itself, so no separate setup-python step is needed.
        # --locked fails if uv.lock is stale relative to pyproject.toml, rather than silently
        # resolving something else. Do not also set UV_FROZEN - uv rejects the combination, since
        # --frozen means "use the lockfile as-is without checking it".
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Test
        env:
          # A service container is reachable on localhost for jobs running directly on the runner.
          PIKABUS_TEST_AMQP_URL: amqp://amqp:amqp@localhost:5672/
        run: uv run --no-sync python -m unittest discover -p "*Test*.py" -v

