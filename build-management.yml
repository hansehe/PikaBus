build:
    selections:
        install-dep:
            cmd:
                # uv resolves, creates the environment and installs the project in one step,
                # pinned to uv.lock. --locked fails if the lockfile is stale.
                - uv sync --locked
        python:
            cmd:
                # `uv build`, not `setup.py bdist_wheel`: direct setup.py invocation is deprecated,
                # and there is no setup.py any more - metadata lives in pyproject.toml.
                - uv build
                - uv run --group build --no-project twine check dist/*
        docs:
            files:
                - docker-compose.docs.yml

run:
    selections:
        docs:
            files:
                - docker-compose.docs.yml

test:
    selections:
        python:
            cmd:
                - uv run python -m unittest discover -p "*Test*.py"
        container:
            files:
                - docker-compose.test.yml

publish:
    selections:
        python:
            cmd:
                - uv publish

swarm:
    selections:
        python:
            directory: ServiceDependencies
            files:
                - swarm-management.yml
